; ============================================================
;  ChatBox.ini - 消息历史窗口的配置文件
;
;  放到游戏根目录（gamemd.exe 所在目录），与 ChatBox.dll 同级。
;  本文件不存在时，全部使用下面的默认值。
;
;  ★ 阶段 1 说明：目前只有"捕获"功能，没有任何窗口显示。
;    日志写在  <游戏目录>\MsgLog\YYYY-MM-DD_HH-MM-SS.log
; ============================================================

[ChatBox]

; ------------------------------------------------------------
; 总开关
;   1 = 启用（默认）, 0 = 完全关闭（连日志都不写）
; ------------------------------------------------------------
ChatBox=1

; ------------------------------------------------------------
; 日志详细程度
;   0 = 精简（默认）—— 只记人能直接看的内容：
;         [09-20 22:15:03] #12 moonbamboo: test
;         [09-20 22:15:04] #13 难度： 终结
;
;   1 = 完整 —— 额外记录排查/标定用的字段：
;         [..] #12 ret=0x0055F0FA id=2 cs=7 style=0x4046 to=1259 sp=0
;                  nameLen=10 textLen=4 name="moonbamboo" text="test"
;         以及界面诊断行：
;         [..] draw: lineH=17 (BitFont+0x1C=17)     字体度量
;         [..] draw: cfg MaxWidth=0 (0 = auto)      宽度配置
;         [..] ui: expanded (click)                 展开/折叠切换记录
;
;       各字段含义：
;         ret    调用者返回地址 —— 定位消息由游戏里哪段代码发出，
;                据此可区分【快捷键提示】这类高频消息
;         id     消息 ID（玩家聊天时是发言者槽位）
;         cs     颜色方案索引
;         style  文本样式标志
;         to     超时帧数（-1 = 永不消失）
;         sp     silent 标志（1 = 操作提示类，见下面 FilterSilent）
;
;   这些字段对日常阅读没有意义，只在排查问题时才需要打开。
;
;   注：下面这几行【不受本开关控制】，始终会写进日志（它们都很短、
;       且只在特定时刻各写一次，不会刷屏）：
;         ChatBox <版本> start     —— DLL 加载成功
;         hook: frame alive        —— 帧钩子(输入)被执行
;         hook: draw  alive        —— 绘制钩子被执行
;         ui: expanded/collapsed   —— 你按了 Ctrl+M 或点了消息框
;       判断"插件到底活着没有"，看这几行就够。
; ------------------------------------------------------------
LogRaw=0

; ------------------------------------------------------------
; 记录消息文本
;   1 = 记录来源(name)与正文(text)的实际内容（默认）
;   0 = 只记录长度，不记录内容（日志更小，适合长时间挂机）
;
;   文本里的换行会被转义成 \n，保证"一条消息一行"，便于事后 grep。
; ------------------------------------------------------------
LogText=1

; ------------------------------------------------------------
; 日志编码
;   0 = 本地代码页（中文系统即 GBK，默认）—— 记事本可直接打开
;   1 = UTF-8（带 BOM）—— 便于用 VS Code / 命令行工具处理
;
;   注意：同一个日志文件不要中途切换编码，否则会混编码。
; ------------------------------------------------------------
LogUtf8=0

; ------------------------------------------------------------
; 附：日志文件何时创建
;   只在【捕获到第一条消息】时才创建，所以如果某个进程加载了本 DLL
;   但一条消息都没产生（例如游戏启动器），不会留下空日志文件。
; ------------------------------------------------------------


; ============================================================
;  阶段 2：消息窗口
; ============================================================

; ------------------------------------------------------------
; 显示自制消息框
;   1 = 接管绘制（默认）：原版左上角的消息列表不再显示，
;       改由本插件在同样位置画消息框（含半透明底板、按玩家颜色着色）
;   0 = 完全不碰画面，原版行为照旧
;
;   注意：接管绘制后聊天消息【只会】出现在消息框里 —— 这是刻意的，
;   否则同一条消息会在左上角和消息框里各显示一遍。
; ------------------------------------------------------------
ShowWindow=1

; ------------------------------------------------------------
; 折叠态最多同时显示几条
;   新消息出现在最上面一行，旧的往下排。范围 1~40，默认 8。
;   （"折叠/展开"的区分见 §阶段 3）
; ------------------------------------------------------------
MaxLines=8

; ------------------------------------------------------------
; 底板不透明度
;   0 = 完全透明（只有文字）, 100 = 全黑。默认 45。
; ------------------------------------------------------------
BoardOpacity=45

; ------------------------------------------------------------
; 窗口位置（左上角坐标，像素）
;   默认 8,8 —— 与原版消息位置基本一致。
; ------------------------------------------------------------
PosX=8
PosY=8

; ------------------------------------------------------------
; 顶部预留的行数（默认 1）
;   原版按回车输入消息时，屏幕顶部会显示"从【玩家名】："输入框，
;   原版的消息列表会被往下推。消息框也预留这么多行，免得盖住输入框。
;
;   0 = 紧贴顶部（会盖住输入框）
;   1 = 留一行空档（默认）
;   2 = 留两行
;
;   用"行数"而不是像素，省得你去算字高（实测字高 17 像素）。
; ------------------------------------------------------------
TopGapLines=1

; ------------------------------------------------------------
; 始终保留的最新消息条数（默认 1）
;   即使这些消息已经超时，也一直显示。
;
;   为什么需要它：消息全部过期后消息框会整个消失 ——
;   此时按 Ctrl+M 虽然切换了展开状态，但没有内容可画，看起来就像
;   "唤不出消息框"，要等下一条消息到达才显现。保留 1 条即可避免。
;
;   0 = 不保留（全部过期后消息框消失）
;   1 = 始终保留最新 1 条（默认）
; ------------------------------------------------------------
KeepLast=1

; ------------------------------------------------------------
; 一次最多回看多少条消息（默认 100，范围 10 ~ 500）
;   展开后往上翻能翻到多远。数值越大占用内存越多：
;     100 条约 130 KB（默认）
;     500 条约 660 KB
;   注意：内存历史总容量固定 500 条，所以填 500 就是上限。
;   超过 500 的旧消息仍然完整保存在日志文件里。
; ------------------------------------------------------------
MaxHistory=100

; ------------------------------------------------------------
; 消息框最大宽度（像素）
;   0  = 自动：取屏幕宽度的一半，上限 520（默认）
;   >0 = 直接用这个值，会夹紧到 80 ~ 屏幕可用宽度
;
;   想测试/观察自动折行效果时，把这里改小最方便 —— 例如 200，
;   那么原来正好放得下的一行文本就会折成两三行。
; ------------------------------------------------------------
MaxWidth=0

; ------------------------------------------------------------
; 展开态最多显示多少行
;   默认 15，范围 2 ~ 200
;
;   按 Ctrl+M（或左键点消息框）在"折叠 / 展开"之间切换：
;     折叠态：只显示最新 MaxLines 行（默认 8）
;     展开态：显示 ExpandLines 行，可往回翻历史
;
;   展开后：
;     ↑ / ↓              上/下滚动一行
;     PageUp / PageDown  翻页
;     Home / End         跳到最旧的一屏 / 回到最新
;     鼠标滚轮           同上（悬停在消息框上时）
;     Ctrl+M / 点框外    收起
; ------------------------------------------------------------
ExpandLines=15

; ------------------------------------------------------------
; 翻页 / 滚轮一次的步长（行）
;   默认 5，范围 1 ~ 50
;
;   这个值决定每次 PageUp/PageDown 或滚轮滚动多少行。
;   调小（比如 3）→ 内容连续移动更细腻，但翻得慢
;   调大（比如 15）→ 一次一屏，快但"没有中间过程"，
;                     容易让人怀疑自己是不是翻过头了
; ------------------------------------------------------------
ScrollStep=5

; ------------------------------------------------------------
; 系统消息的颜色
;   0 = 用消息自带的颜色方案（默认，原版行为，例如剧情文本的固定浅色）
;   1 = 用【当前玩家(我)】的颜色
;       剧情/任务/系统提示统一成我自己的颜色，整体像"我的聊天框"。
;
;   注意：这条只影响【系统/剧情消息】。
;   玩家聊天永远用【发言者自己】的颜色（与原版一致），不受此项影响。
; ------------------------------------------------------------
SysUseMyColor=0

; ------------------------------------------------------------
; 过滤操作提示
;   1 = 操作提示类消息【不进消息框】（默认）
;   0 = 全部进消息框
;
;   依据（阶段 1 实测 56 条消息得出的规律）：
;     AddMessage 的第 7 个参数其实是 silent 标志，不是 SinglePlayer。
;     所有快捷提示（"选取部队横越地图"）和路径点提示都是 silent=1，
;     所有真消息（聊天/剧情/结盟/系统）都是 silent=0 —— 零例外。
;     快捷键提示频率极高，放进来会把内容冲掉，所以默认过滤。
;
;   注意：过滤只影响【消息框显示】，它们照样会写进日志文件。
; ------------------------------------------------------------
FilterSilent=1

; ------------------------------------------------------------
; 让操作提示照旧显示（预留，暂未实现）
;   1 = 把 silent 消息仍然用原版样式画在左上角、自己超时消失
;   0 = 干脆不显示（默认）
; ------------------------------------------------------------
ShowLogHint=0
