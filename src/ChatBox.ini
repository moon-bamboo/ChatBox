; ============================================================
;  ChatBox.ini - 消息历史窗口的配置文件
;
;  放到游戏根目录（gamemd.exe 所在目录），与 ChatBox.dll 同级。
;  本文件不存在时，全部使用下面的默认值。
;
;  ★ 阶段 1 说明：目前只有"捕获"功能，没有任何窗口显示。
;    日志写在  <游戏目录>\MsgLog\YYYY-MM-DD_HH-MM-SS.log
; ============================================================

[ChatBox]

; ------------------------------------------------------------
; 总开关
;   1 = 启用（默认）, 0 = 完全关闭（连日志都不写）
; ------------------------------------------------------------
ChatBox=1

; ------------------------------------------------------------
; 记录原始参数（阶段 1 标定用）
;   1 = 每条消息记录：调用者返回地址、ID、颜色方案、Style、
;       超时帧数、SinglePlayer、以及来源/正文的长度
;
;   为什么要记"调用者返回地址"：用来定位消息是游戏里哪段代码发的，
;   从而区分出【快捷键提示】（如"选中画面相同单位"）—— 那类消息频率
;   极高，必须认出来并分流，否则会把消息框淹没。
; ------------------------------------------------------------
LogRaw=1

; ------------------------------------------------------------
; 记录消息文本
;   1 = 记录来源(name)与正文(text)的实际内容（默认）
;   0 = 只记录长度，不记录内容（日志更小，适合长时间挂机）
;
;   文本里的换行会被转义成 \n，保证"一条消息一行"，便于事后 grep。
; ------------------------------------------------------------
LogText=1

; ------------------------------------------------------------
; 日志编码
;   0 = 本地代码页（中文系统即 GBK，默认）—— 记事本可直接打开
;   1 = UTF-8（带 BOM）—— 便于用 VS Code / 命令行工具处理
;
;   注意：同一个日志文件不要中途切换编码，否则会混编码。
; ------------------------------------------------------------
LogUtf8=0

; ------------------------------------------------------------
; 附：日志文件何时创建
;   只在【捕获到第一条消息】时才创建，所以如果某个进程加载了本 DLL
;   但一条消息都没产生（例如游戏启动器），不会留下空日志文件。
; ------------------------------------------------------------


; ============================================================
;  阶段 2：消息窗口
; ============================================================

; ------------------------------------------------------------
; 显示自制消息框
;   1 = 接管绘制（默认）：原版左上角的消息列表不再显示，
;       改由本插件在同样位置画消息框（含半透明底板、按玩家颜色着色）
;   0 = 完全不碰画面，原版行为照旧
;
;   注意：接管绘制后聊天消息【只会】出现在消息框里 —— 这是刻意的，
;   否则同一条消息会在左上角和消息框里各显示一遍。
; ------------------------------------------------------------
ShowWindow=1

; ------------------------------------------------------------
; 折叠态最多同时显示几条
;   新消息出现在最上面一行，旧的往下排。范围 1~40，默认 8。
;   （"折叠/展开"的区分见 §阶段 3）
; ------------------------------------------------------------
MaxLines=8

; ------------------------------------------------------------
; 底板不透明度
;   0 = 完全透明（只有文字）, 100 = 全黑。默认 45。
; ------------------------------------------------------------
BoardOpacity=45

; ------------------------------------------------------------
; 窗口位置（左上角坐标，像素）
;   默认 8,8 —— 与原版消息位置基本一致。
; ------------------------------------------------------------
PosX=8
PosY=8

; ------------------------------------------------------------
; 消息框最大宽度（像素）
;   0  = 自动：取屏幕宽度的一半，上限 520（默认）
;   >0 = 直接用这个值，会夹紧到 80 ~ 屏幕可用宽度
;
;   想测试/观察自动折行效果时，把这里改小最方便 —— 例如 200，
;   那么原来正好放得下的一行文本就会折成两三行。
; ------------------------------------------------------------
MaxWidth=0

; ------------------------------------------------------------
; 展开态最多显示多少行
;   按 Ctrl+M 在"折叠 / 展开"之间切换：
;     折叠态：只显示最新 MaxLines 行（默认 8）
;     展开态：显示 ExpandLines 行（默认 30），并可用键盘往回翻历史
;
;   展开后的键盘操作：
;     ↑ / ↓           上/下滚动一行
;     PageUp / PageDown  翻页
;     Home / End      跳到最旧 / 回到最新
;     Ctrl+M          收起
; ------------------------------------------------------------
ExpandLines=30

; ------------------------------------------------------------
; 系统消息的颜色
;   1 = 用【当前玩家(我)】的颜色（默认）
;       剧情/任务/系统提示统一成我自己的颜色，整体像"我的聊天框"。
;   0 = 用消息自带的颜色方案（原版行为，例如剧情文本的固定浅色）
;
;   注意：这条只影响【系统/剧情消息】。
;   玩家聊天永远用【发言者自己】的颜色（与原版一致），不受此项影响。
; ------------------------------------------------------------
SysUseMyColor=1

; ------------------------------------------------------------
; 过滤操作提示
;   1 = 操作提示类消息【不进消息框】（默认）
;   0 = 全部进消息框
;
;   依据（阶段 1 实测 56 条消息得出的规律）：
;     AddMessage 的第 7 个参数其实是 silent 标志，不是 SinglePlayer。
;     所有快捷提示（"选取部队横越地图"）和路径点提示都是 silent=1，
;     所有真消息（聊天/剧情/结盟/系统）都是 silent=0 —— 零例外。
;     快捷键提示频率极高，放进来会把内容冲掉，所以默认过滤。
;
;   注意：过滤只影响【消息框显示】，它们照样会写进日志文件。
; ------------------------------------------------------------
FilterSilent=1

; ------------------------------------------------------------
; 让操作提示照旧显示（预留，暂未实现）
;   1 = 把 silent 消息仍然用原版样式画在左上角、自己超时消失
;   0 = 干脆不显示（默认）
; ------------------------------------------------------------
ShowLogHint=0
